# 严格风控敏感面清单（来源：0xkaka/homeport §10，2026-11-23 记录）
# 状态：本文件未被任何主配置引用，也未在 rule-providers 里定义。
# 买日本静态 IP、逐步停掉机场后启用：建一个指向静态 IP 节点的 STATIC 组，
# 在主配置加一个 classical 提供方定义 + 一行 - RULE-SET,strict-surface,STATIC。
#
# 写法说明（已按 Mihomo 规则核对过）：
# - behavior: classical 的 payload 条目，策略由 RULE-SET 那行统一给。
# - 本文件因此不能放 Anthropic 的两个 IPv6 REJECT 段（2607:6bc0::/48、
# 2607:6bc0:11::/48）：一个 RULE-SET 行只能给一个策略，REJECT 需单独写成
# 主配置里的两行普通规则：IP-CIDR6,2607:6bc0::/48,REJECT,no-resolve
# 与 IP-CIDR6,2607:6bc0:11::/48,REJECT,no-resolve。启用时别忘了补。
# - IP-CIDR / IP-ASN 条目保留了,no-resolve（这是规则参数，不是策略）。
